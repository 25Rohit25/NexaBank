name: Nexa Bank CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Maven reactor
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet

  kubernetes:
    name: Kubernetes validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - name: Render base manifests
        run: kubectl kustomize infrastructure/kubernetes/base > /tmp/nexa-bank-base.yaml
      - name: Render production manifests
        run: kubectl kustomize infrastructure/kubernetes/overlays/production > /tmp/nexa-bank-production.yaml
      - name: Require rendered resources
        run: test -s /tmp/nexa-bank-base.yaml && test -s /tmp/nexa-bank-production.yaml

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose, kubernetes]
    steps:
      - uses: actions/checkout@v7
      - name: Build application images
        run: >-
          docker compose build
          customer-service
          account-service
          transaction-service
          notification-service
          audit-service
          api-gateway
          banking-mcp-server
          agent-service
          frontend
