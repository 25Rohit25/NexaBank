name: Nexa Bank CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Maven reactor
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: >-
          docker compose build
          customer-service
          account-service
          transaction-service
          notification-service
          audit-service
          api-gateway
          banking-mcp-server
          agent-service
          frontend
