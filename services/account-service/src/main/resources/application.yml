server:
  port: ${ACCOUNT_SERVICE_PORT:8082}

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DATABASE_URL:jdbc:postgresql://localhost:5432/nexa_account}
    username: ${POSTGRES_USER:nexa}
    password: ${POSTGRES_PASSWORD:nexa-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

clients:
  customer-service:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

security:
  jwt:
    secret: ${JWT_SECRET:nexa-local-development-secret-change-me}
    issuer: nexa-bank

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
