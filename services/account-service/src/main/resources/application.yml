server:
  port: ${ACCOUNT_SERVICE_PORT:8082}

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DATABASE_URL:jdbc:postgresql://localhost:5432/nexa_account}
    username: ${POSTGRES_USER:nexa}
    password: ${POSTGRES_PASSWORD:nexa-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

outbox:
  publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}

clients:
  customer-service:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

security:
  jwt:
    secret: ${JWT_SECRET:nexa-local-development-secret-change-me}
    issuer: nexa-bank

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
