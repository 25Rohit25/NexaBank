server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/customers/**
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/accounts/**,/api/v1/transfers/**
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/transactions/**
            - id: agent-service
              uri: ${AGENT_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/agent/**
            - id: banking-mcp-server
              uri: ${BANKING_MCP_URL:http://localhost:8090}
              predicates:
                - Path=/mcp/**

security:
  jwt:
    secret: ${JWT_SECRET:nexa-local-development-secret-change-me}
    issuer: nexa-bank

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
