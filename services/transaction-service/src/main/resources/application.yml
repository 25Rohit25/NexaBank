server:
  port: ${TRANSACTION_SERVICE_PORT:8083}

spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTION_DATABASE_URL:jdbc:postgresql://localhost:5432/nexa_transaction}
    username: ${POSTGRES_USER:nexa}
    password: ${POSTGRES_PASSWORD:nexa-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

security:
  jwt:
    secret: ${JWT_SECRET:nexa-local-development-secret-change-me}
    issuer: nexa-bank

management:
  endpoints:
    web:
      exposure:
        include: health,info
