server:
  port: ${AUDIT_SERVICE_PORT:8085}

spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DATABASE_URL:jdbc:postgresql://localhost:5432/nexa_audit}
    username: ${POSTGRES_USER:nexa}
    password: ${POSTGRES_PASSWORD:nexa-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
