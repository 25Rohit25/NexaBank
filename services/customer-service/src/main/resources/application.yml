server:
  port: ${CUSTOMER_SERVICE_PORT:8081}

spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DATABASE_URL:jdbc:postgresql://localhost:5432/nexa_customer}
    username: ${POSTGRES_USER:nexa}
    password: ${POSTGRES_PASSWORD:nexa-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:nexa-local-development-secret-change-me}
    issuer: nexa-bank
    ttl: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
