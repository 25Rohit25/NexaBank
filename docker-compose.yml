name: nexa-bank

x-java-build: &java-build
  context: .
  dockerfile: infrastructure/docker/java-service.Dockerfile

x-bank-environment: &bank-environment
  POSTGRES_USER: ${POSTGRES_USER:-nexa}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexa-local-only}
  JWT_SECRET: ${JWT_SECRET:-nexa-local-development-secret-change-me}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexa-local-only}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  customer-service:
    build:
      <<: *java-build
      args:
        MODULE: services/customer-service
    environment:
      <<: *bank-environment
      CUSTOMER_DATABASE_URL: jdbc:postgresql://postgres:5432/nexa_customer
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}

  account-service:
    build:
      <<: *java-build
      args:
        MODULE: services/account-service
    environment:
      <<: *bank-environment
      ACCOUNT_DATABASE_URL: jdbc:postgresql://postgres:5432/nexa_account
      CUSTOMER_SERVICE_URL: http://customer-service:8081
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      customer-service: {condition: service_healthy}

  transaction-service:
    build:
      <<: *java-build
      args:
        MODULE: services/transaction-service
    environment:
      <<: *bank-environment
      TRANSACTION_DATABASE_URL: jdbc:postgresql://postgres:5432/nexa_transaction
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  notification-service:
    build:
      <<: *java-build
      args:
        MODULE: services/notification-service
    environment:
      <<: *bank-environment
    ports: ["8084:8084"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      kafka: {condition: service_healthy}

  audit-service:
    build:
      <<: *java-build
      args:
        MODULE: services/audit-service
    environment:
      <<: *bank-environment
      AUDIT_DATABASE_URL: jdbc:postgresql://postgres:5432/nexa_audit
    ports: ["8085:8085"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  api-gateway:
    build:
      <<: *java-build
      args:
        MODULE: services/api-gateway
    environment:
      <<: *bank-environment
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      AGENT_SERVICE_URL: http://agent-service:8091
      BANKING_MCP_URL: http://banking-mcp-server:8090
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      customer-service: {condition: service_healthy}
      account-service: {condition: service_healthy}
      transaction-service: {condition: service_healthy}

  banking-mcp-server:
    build:
      <<: *java-build
      args:
        MODULE: mcp/banking-mcp-server
    environment:
      <<: *bank-environment
      BANKING_GATEWAY_URL: http://api-gateway:8080
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      redis: {condition: service_healthy}
      api-gateway: {condition: service_healthy}

  ollama:
    image: ollama/ollama:0.11.10
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent-service:
    build:
      <<: *java-build
      args:
        MODULE: ai/agent-service
    environment:
      <<: *bank-environment
      RAG_DB_URL: jdbc:postgresql://postgres:5432/nexa_rag
      BANKING_MCP_URL: http://banking-mcp-server:8090
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}
      RAG_INGEST_ON_STARTUP: ${RAG_INGEST_ON_STARTUP:-false}
    ports: ["8091:8091"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      banking-mcp-server: {condition: service_healthy}
      ollama: {condition: service_healthy}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_NEXA_API_URL: ${NEXT_PUBLIC_NEXA_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      NEXT_PUBLIC_NEXA_API_URL: ${NEXT_PUBLIC_NEXA_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      api-gateway: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      customer-service: {condition: service_healthy}
      account-service: {condition: service_healthy}
      transaction-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      audit-service: {condition: service_healthy}
      api-gateway: {condition: service_healthy}
      banking-mcp-server: {condition: service_healthy}
      agent-service: {condition: service_healthy}

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nexa-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3001:3000"]
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_started}

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  ollama-data:
  prometheus-data:
  grafana-data:
