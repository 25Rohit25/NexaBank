server:
  port: ${AGENT_SERVICE_PORT:8091}

spring:
  application:
    name: agent-service
  datasource:
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5432/nexa_rag}
    username: ${POSTGRES_USER:nexa}
    password: ${POSTGRES_PASSWORD:nexa-local-only}
  ai:
    chat:
      memory:
        repository:
          redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            index-name: nexa-agent-chat-memory-idx
            key-prefix: "nexa-agent:conversation:"
            time-to-live: ${AGENT_MEMORY_TTL:30m}
            initialize-schema: true
    mcp:
      client:
        enabled: false
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}
      init:
        pull-model-strategy: never
    vectorstore:
      pgvector:
        initialize-schema: true
        schema-validation: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        table-name: policy_vector_store

security:
  jwt:
    secret: ${JWT_SECRET:nexa-local-development-secret-change-me}
    issuer: nexa-bank

banking:
  mcp-url: ${BANKING_MCP_URL:http://localhost:8090}

nexa:
  memory:
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
  rag:
    ingest-on-startup: ${RAG_INGEST_ON_STARTUP:false}
    top-k: ${RAG_TOP_K:4}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.72}

management:
  endpoints:
    web:
      exposure:
        include: health,info
