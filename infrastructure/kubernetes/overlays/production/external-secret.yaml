apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexa-bank-secrets
  namespace: nexa-bank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nexa-bank-secret-store
    kind: ClusterSecretStore
  target:
    name: nexa-bank-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: nexa-bank/production/postgres-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: nexa-bank/production/jwt-secret
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: nexa-bank/production/grafana-admin-password

