apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexa-bank
  namespace: nexa-bank
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: nexa-bank.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: transaction-service
  namespace: nexa-bank
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: nexa-bank
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-service
  namespace: nexa-bank
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service

