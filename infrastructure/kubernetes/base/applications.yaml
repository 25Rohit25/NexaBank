apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: nexa-bank
  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/part-of: nexa-bank
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-service
        app.kubernetes.io/part-of: nexa-bank
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: customer-service
        image: ghcr.io/25rohit25/nexabank-customer-service:latest
        imagePullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 8081
        envFrom:
          - configMapRef:
              name: nexa-bank-config
          - secretRef:
              name: nexa-bank-secrets
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: nexa-bank
  labels:
    app.kubernetes.io/name: customer-service
spec:
  selector:
    app.kubernetes.io/name: customer-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
